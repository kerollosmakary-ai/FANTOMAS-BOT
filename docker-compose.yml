services:
  backend:
    build:
      context: ./backend
      args:
        APP_UID: "1000"
        APP_GID: "1078"
    container_name: ai-bot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    container_name: ai-bot-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

