name: Deploy to fserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH and Deploy
        env:
          SSH_KEY: ${{ secrets.FSERVER_SSH_KEY }}
          SERVER_IP: 167.233.103.236
          SERVER_USER: root
        run: |
          echo "🔧 Setting up SSH key..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/fserver_key
          chmod 600 ~/.ssh/fserver_key
          ssh-keyscan -H $SERVER_IP > ~/.ssh/known_hosts 2>/dev/null
          
          echo "🚀 Deploying to fserver..."
          ssh -i ~/.ssh/fserver_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SERVER_USER@$SERVER_IP << 'REMOTE_SCRIPT'
            set -e
            echo "📥 Pulling latest code..."
            cd /root/ai-bot
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master
            
            echo "🔄 Restarting services..."
            if [ -f docker-compose.yml ]; then
              docker compose up -d --build
            elif [ -f backend/Dockerfile ]; then
              cd backend
              docker build -t ai-bot .
              docker rm -f ai-bot-backend 2>/dev/null || true
              docker run -d -p 8000:8000 --restart unless-stopped --name ai-bot-backend ai-bot
            else
              pkill -f "uvicorn" || true
              cd backend
              nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /dev/null 2>&1 &
            fi
            
            echo "✅ Deployment complete!"
            sleep 3
            curl -s http://localhost:8000/health || echo "Health check failed"
          REMOTE_SCRIPT
