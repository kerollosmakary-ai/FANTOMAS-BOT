name: Deploy to fserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to fserver via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 167.233.103.236
          username: root
          key: ${{ secrets.FSERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting deployment..."
            cd /root/ai-bot
            
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master
            
            echo "🔄 Restarting services..."
            if [ -f docker-compose.yml ]; then
              docker compose up -d --build
            elif [ -f backend/Dockerfile ]; then
              cd backend
              docker build -t ai-bot .
              docker run -d -p 8000:8000 --restart unless-stopped --name ai-bot-backend ai-bot || docker restart ai-bot-backend
            else
              pkill -f "uvicorn" || true
              cd backend
              nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /dev/null 2>&1 &
            fi
            
            echo "✅ Deployment complete!"
            sleep 3
            echo "🔍 Health check:"
            curl -s http://localhost:8000/health || echo "Health check failed"
